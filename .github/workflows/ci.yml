name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2; reviewed 2026-08-15
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4; reviewed 2026-08-15
      - run: swift --version
      - run: swift format lint --recursive --strict Sources Tests Plugins Package.swift
      - run: sh scripts/run-swiftpm-external.sh test --parallel
      - run: sh scripts/run-swiftpm-external.sh build
      - run: sh scripts/run-swiftpm-external.sh build -c release
      - run: sh scripts/run-swiftpm-external.sh run meta-marketing-gateway-reader --help
      - run: sh scripts/run-swiftpm-external.sh run meta-marketing-gateway-writer --help
      - run: sh scripts/run-swiftpm-external.sh run meta-marketing-gateway-reader catalog list
      - run: sh scripts/run-swiftpm-external.sh run meta-marketing-gateway-writer catalog list
      - run: sh scripts/verify-focused-safety-tests.sh
      - run: sh scripts/verify-target-separation.sh
      - run: sh scripts/verify-catalog-projections.sh
      - run: sh scripts/verify-dependencies.sh
      - run: sh scripts/verify-supply-chain.sh
      - run: sh scripts/verify-no-secret-artifacts.sh
      - run: sh scripts/verify-reproducible-archives.sh
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9; reviewed 2026-08-15
      - uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1; reviewed 2026-08-15
